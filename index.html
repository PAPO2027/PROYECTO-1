<!doctype html><html lang='es'><head><meta charset='utf-8'><title>Snake Evolution</title><style>
body{margin:0;background:#141e30;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}.wrap{width:650px;text-align:center}.card{background:#202020;padding:28px;border-radius:20px}h1{color:#4ade80}.levels button,.colors button{margin:5px;padding:12px;border:0;border-radius:9px;background:#333;color:#fff;cursor:pointer}.sel{background:#4ade80!important;color:#000!important}.colors button{width:44px;height:44px;border-radius:50%}.g{background:#22c55e!important}.b{background:#3b82f6!important}.r{background:#ef4444!important}.p{background:#a855f7!important}.y{background:#eab308!important}.c{background:#06b6d4!important}#game{display:none}.info{display:flex;justify-content:space-between;background:#252525;padding:10px;border-radius:8px;margin-bottom:8px}canvas{width:600px;max-width:100%;background:#080808;border:3px solid #444}button{font-weight:bold}.controls button{width:55px;height:45px;background:#333;color:white;border:0;border-radius:8px;margin:2px;font-size:18px}.main{padding:14px 30px;background:#4ade80;border:0;border-radius:10px;font-size:18px}.msg{height:30px;padding:10px}
</style></head><body><div class='wrap'>
<div id='menu' class='card'><h1>🐍 SNAKE EVOLUTION</h1><p>Come, crece y supera los 4 niveles.</p><h3>Nivel inicial</h3><div class='levels'><button id='l1' class='sel' onclick='setLevel(1)'>Nivel 1<br>Fácil</button><button id='l2' onclick='setLevel(2)'>Nivel 2<br>Normal</button><button id='l3' onclick='setLevel(3)'>Nivel 3<br>Difícil</button><button id='l4' onclick='setLevel(4)'>Nivel 4<br>Extremo</button></div><h3>Color</h3><div class='colors'><button class='g sel' onclick='setColor("#22c55e",this)'></button><button class='b' onclick='setColor("#3b82f6",this)'></button><button class='r' onclick='setColor("#ef4444",this)'></button><button class='p' onclick='setColor("#a855f7",this)'></button><button class='y' onclick='setColor("#eab308",this)'></button><button class='c' onclick='setColor("#06b6d4",this)'></button></div><button class='main' onclick='start()'>🎮 JUGAR</button></div>
<div id='game'><h1>🐍 SNAKE</h1><div class='info'><span>🍎 <b id='score'>0</b></span><span>Nivel <b id='level'>1</b></span><span>🐍 <b id='len'>3</b></span><span>❤️ <b id='lives'>3</b></span></div><canvas id='c' width='600' height='600'></canvas><div id='msg' class='msg'>¡Come la comida!</div><button onclick='pause()'>⏸️ Pausa</button><button onclick='start()'>🔄 Reiniciar</button><button onclick='menu()'>🏠 Menú</button><div class='controls'><br><button onclick='move(0,-1)'>⬆️</button><br><button onclick='move(-1,0)'>⬅️</button><button onclick='move(0,1)'>⬇️</button><button onclick='move(1,0)'>➡️</button></div><p>Flechas o WASD</p></div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),S=30,N=20;let snake,food,dir,next,score,level=1,lives,timer,active=false,paused=false,color='#22c55e';const speed={1:180,2:130,3:90,4:55},goal={1:5,2:10,3:15,4:20};
function setLevel(n){level=n;for(let i=1;i<5;i++)document.getElementById('l'+i).classList.toggle('sel',i===n)}function setColor(c,b){color=c;document.querySelectorAll('.colors button').forEach(z=>z.classList.remove('sel'));b.classList.add('sel')}
function start(){menuHide();score=0;lives=3;paused=false;snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next={x:1,y:0};active=true;foodNew();ui();clearInterval(timer);timer=setInterval(tick,speed[level]);draw()}
function menuHide(){document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block'}function menu(){active=false;clearInterval(timer);document.getElementById('game').style.display='none';document.getElementById('menu').style.display='block'}
function foodNew(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function move(a,b){if(a===-dir.x&&b===-dir.y)return;next={x:a,y:b}}
function tick(){if(!active||paused)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){lives--;if(lives<=0){active=false;clearInterval(timer);document.getElementById('msg').textContent='💀 GAME OVER — pulsa Reiniciar';return}snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;document.getElementById('msg').textContent='💥 Perdiste una vida';ui();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;foodNew();if(level<4&&score>=goal[level]){level++;clearInterval(timer);timer=setInterval(tick,speed[level]);document.getElementById('msg').textContent='🔥 ¡Subiste al nivel '+level+'!'}else if(level===4&&score>=goal[4]){active=false;clearInterval(timer);document.getElementById('msg').textContent='🏆 ¡GANASTE LOS 4 NIVELES!'}}else snake.pop();ui();draw()}
function ui(){document.getElementById('score').textContent=score;document.getElementById('level').textContent=level;document.getElementById('len').textContent=snake.length;document.getElementById('lives').textContent=lives}function pause(){if(!active)return;paused=!paused;document.getElementById('msg').textContent=paused?'⏸️ PAUSADO':'▶️ ¡Continúa!'}
function draw(){x.fillStyle='#080808';x.fillRect(0,0,600,600);x.strokeStyle='#151515';for(let i=0;i<=600;i+=30){x.beginPath();x.moveTo(i,0);x.lineTo(i,600);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(600,i);x.stroke()}x.fillStyle='#ef4444';x.beginPath();x.arc(food.x*30+15,food.y*30+15,11,0,Math.PI*2);x.fill();snake.forEach((s,i)=>{x.fillStyle=color;x.fillRect(s.x*30+2,s.y*30+2,26,26);if(i===0){x.fillStyle='white';x.fillRect(s.x*30+7,s.y*30+7,5,5);x.fillRect(s.x*30+18,s.y*30+7,5,5)}})}
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')move(0,-1);if(k==='arrowdown'||k==='s')move(0,1);if(k==='arrowleft'||k==='a')move(-1,0);if(k==='arrowright'||k==='d')move(1,0);if(k===' ')pause()});
</script></body></html>
